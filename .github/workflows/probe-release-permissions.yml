name: probe release permissions
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Which release call does the runner token allow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          R=herbert-kara/NiNG
          # 1. a draft, which we know succeeded for .31
          if gh release create v0.0.0-probe-draft --repo "$R" --draft --title p --notes p >/dev/null 2>err1; then
            echo "CREATE_DRAFT: ok"
          else
            echo "CREATE_DRAFT: $(cat err1 | head -1)"
          fi
          # 2. publish that draft -- this is the alternative fix if create-published is refused
          if gh release edit v0.0.0-probe-draft --repo "$R" --draft=false >/dev/null 2>err2; then
            echo "PUBLISH_EXISTING_DRAFT: ok"
          else
            echo "PUBLISH_EXISTING_DRAFT: $(cat err2 | head -1)"
          fi
          # 3. create one already published, which is what failed with 403
          if gh release create v0.0.0-probe-live --repo "$R" --title p --notes p >/dev/null 2>err3; then
            echo "CREATE_PUBLISHED: ok"
          else
            echo "CREATE_PUBLISHED: $(cat err3 | head -1)"
          fi
          # 4. and with --latest, which the failing command also passed
          if gh release create v0.0.0-probe-latest --repo "$R" --latest --title p --notes p >/dev/null 2>err4; then
            echo "CREATE_PUBLISHED_LATEST: ok"
          else
            echo "CREATE_PUBLISHED_LATEST: $(cat err4 | head -1)"
          fi
          for t in v0.0.0-probe-draft v0.0.0-probe-live v0.0.0-probe-latest; do
            gh release delete "$t" --repo "$R" --yes --cleanup-tag >/dev/null 2>&1 || true
          done