name: probe release permissions
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Which part of the failing command is refused
        env:
          GH_TOKEN: ${{ github.token }}
          # an ancestor of the tip but not the tip itself
          OLD: 9c9fc229407f3f600a3d0dd10bd0a08b8b6cb1be
        run: |
          set -uo pipefail
          R=herbert-kara/NiNG
          TIP=$(git ls-remote https://github.com/herbert-kara/NiNG.git refs/heads/my-releases | cut -f1)
          echo "tip is ${TIP:0:12}"

          # E. --target = the tip commit
          if gh release create v0.0.0-e --repo "$R" --target "$TIP" --title p --notes p >/dev/null 2>e; then
            echo "E target=tip: ok"
          else echo "E target=tip: $(head -1 e)"; fi

          # F. --target = the branch name
          if gh release create v0.0.0-f --repo "$R" --target my-releases --title p --notes p >/dev/null 2>e; then
            echo "F target=branch: ok"
          else echo "F target=branch: $(head -1 e)"; fi

          # G. --target = an ancestor that is not the tip
          if gh release create v0.0.0-g --repo "$R" --target "$OLD" --title p --notes p >/dev/null 2>e; then
            echo "G target=ancestor: ok"
          else echo "G target=ancestor: $(head -1 e)"; fi

          # H. no --target at all
          if gh release create v0.0.0-h --repo "$R" --title p --notes p >/dev/null 2>e; then
            echo "H no target: ok"
          else echo "H no target: $(head -1 e)"; fi

          for t in v0.0.0-e v0.0.0-f v0.0.0-g v0.0.0-h; do
            gh release delete "$t" --repo "$R" --yes --cleanup-tag >/dev/null 2>&1 || true
          done