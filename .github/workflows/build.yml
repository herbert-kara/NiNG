name: NiNG signed APK release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag for a draft prerelease (empty uploads artifacts only)
        required: false
        type: string
      # A dispatch is a person asking for a release, so it publishes. Without this the input
      # existed only on workflow_call, and every manual release came out as a draft that had to
      # be published by a second command -- which is the step that gets forgotten, and a draft
      # release is not one the in-app updater can see.
      draft:
        description: Publish as a draft instead of a release
        required: false
        default: false
        type: boolean
  # The sync cannot use gh workflow run to call this: a workflow's own GITHUB_TOKEN is not
  # allowed to start another workflow, and the dispatch comes back 403 Resource not accessible by
  # integration. Called as a reusable workflow instead, the same run that the sync would have
  # dispatched happens inline -- same signing steps, same secrets, and the sync can wait for it
  # because it is a job of the same run rather than a run it has to go and find.
  workflow_call:
    inputs:
      release_tag:
        description: Tag to publish under, so the in-app updater can see the new version
        required: true
        type: string
      draft:
        description: Publish as a draft, for a manual dispatch where someone will look at it
        required: false
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: ning-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'herbert-kara/NiNG'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The stable release aether's own release workflow built with; pinned so a new stable
      # release cannot change or break the release build on its own. Bump it together with
      # the aether submodule.
      RUST_TOOLCHAIN: "1.98.1"
      # The Go line the Psiphon client's go.mod asks for, which also covers lyrebird's older one;
      # aether/psiphon-build.sh and aether/pt-build.sh pin the programs themselves. Bump it when a
      # bumped aether submodule pins a program that asks for a newer line.
      GO_VERSION: "1.26"

      RELEASE_TAG: ${{ inputs.release_tag || 'v0.0.0-ning.0' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Restore cached libaether
      id: cache-libaether-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-aether
        key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

    - name: Build libaether
      if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-aether.sh

    - name: Save libaether
      if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-aether
        key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        # The client is built from a checkout of its own; there is no go.sum here to cache by.
        cache: false

    # The Aether core runs Psiphon as a program of its own, the psiphon-tunnel-core console client,
    # which the app ships beside the core as libpsiphon-tunnel-core.so; see compile-psiphon.sh.
    - name: Restore cached Psiphon client
      id: cache-psiphon-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/psiphon-build.sh') }}-${{ hashFiles('compile-psiphon.sh') }}

    - name: Build the Psiphon client
      if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-psiphon.sh

    - name: Save the Psiphon client
      if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/psiphon-build.sh') }}-${{ hashFiles('compile-psiphon.sh') }}

    # Tor's bridges run through a pluggable transport, a program of its own: lyrebird, which aether
    # builds and the app ships beside the core as liblyrebird.so; see compile-pt.sh.
    - name: Restore cached pluggable transport
      id: cache-pt-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/pt-build.sh') }}-${{ hashFiles('compile-pt.sh') }}

    - name: Build the pluggable transport
      if: steps.cache-pt-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-pt.sh

    - name: Save the pluggable transport
      if: steps.cache-pt-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/pt-build.sh') }}-${{ hashFiles('compile-pt.sh') }}

    - name: Stage the native libraries
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app
        cp -r ${{ github.workspace }}/libs-aether/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-psiphon/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-pt/. ${{ github.workspace }}/V2rayNG/app/libs/

    # Psiphon's client starts with the newest server list the build could fetch, so a fresh install has
    # servers before it can reach the list on its own; see fetch-psiphon-servers.sh.
    - name: Fetch the Psiphon server list
      run: |
        bash fetch-psiphon-servers.sh

    # The AAR is the native core's Kotlin binding, so its symbols have to match the Kotlin that
    # calls them. Upstream's release tag lags the commit PattNG pins, and the download by tag then
    # succeeds while handing over an AAR that predates the native work the Kotlin uses -- the
    # failure is an unresolved reference at compile time, which reads as a broken merge rather than
    # a stale artifact. tools/fetch-libv2ray.sh uses the release only when the tag is the pinned
    # commit and builds from the submodule otherwise. Cached on the pinned commit, so only a core
    # bump pays for the build.
    - uses: actions/cache@v4
      id: libv2ray
      with:
        path: V2rayNG/app/libs/libv2ray.aar
        key: libv2ray-${{ runner.os }}-ndk29-${{ hashFiles('.git/modules/AndroidLibXrayLite/HEAD') }}

    - name: Fetch or build libv2ray
      if: steps.libv2ray.outputs.cache-hit != 'true'
      run: bash tools/fetch-libv2ray.sh

    - name: Setup Java
      uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin'
        java-version: '21'


  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.release_tag != ''
    # A job's env does not inherit another job's env. This job compiles native code and reads
    # the native cache keys, so the pins the build job exports have to be repeated here; an
    # empty RUST_TOOLCHAIN makes dtolnay/rust-toolchain fail with an unhelpful error.
    env:
      RUST_TOOLCHAIN: '1.98.1'
      GO_VERSION: '1.26'
      RELEASE_TAG: ${{ inputs.release_tag || 'v0.0.0-ning.0' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;29.0.14206865'
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact native cache identity
        id: native
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "hev=$(git rev-parse HEAD:hev-socks5-tunnel)" >> "$GITHUB_OUTPUT"
          echo "aether=$(git rev-parse HEAD:aether)" >> "$GITHUB_OUTPUT"
      - name: Download paired Xray core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
          mkdir -p V2rayNG/app/libs
          gh release download "$tag" --repo patterniha/AndroidLibXrayLite --pattern libv2ray.aar --dir V2rayNG/app/libs
      - name: Compile and unit tests before native build
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest --stacktrace
      - uses: actions/cache@v4
        id: hev-cache
        with:
          path: libs
          key: hev-${{ runner.os }}-ndk29-${{ steps.native.outputs.hev }}-${{ hashFiles('compile-hevtun.sh') }}
      - name: Build pinned hev
        if: steps.hev-cache.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh
      - uses: actions/cache@v4
        id: aether-cache
        with:
          path: libs-aether
          key: aether-${{ runner.os }}-ndk29-${{ env.RUST_TOOLCHAIN }}-${{ steps.native.outputs.aether }}-${{ hashFiles('compile-aether.sh') }}
      - uses: dtolnay/rust-toolchain@master
        if: steps.aether-cache.outputs.cache-hit != 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Build pinned Aether
        if: steps.aether-cache.outputs.cache-hit != 'true'
        run: bash compile-aether.sh
      - name: Stage native libraries
        run: |
          cp -r libs/. V2rayNG/app/libs/
          cp -r libs-aether/. V2rayNG/app/libs/
      - name: Decode stable NiNG release key
        env:
          KEYSTORE: ${{ secrets.NING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ning-release.p12"
      - name: Reject a malformed release tag before building
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ning\.[0-9]+$ ]] || {
            echo "::error::release_tag must look like v2.3.9-ning.1, got '$RELEASE_TAG'"; exit 1; }
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Assemble signed release
        working-directory: V2rayNG
        env:
          STORE_PASSWORD: ${{ secrets.NING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assemblePlaystoreRelease --stacktrace \
            -PningVersion="$version" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/ning-release.p12" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -Pandroid.injected.signing.store.type=PKCS12
      - name: Verify signatures and package contents
        env:
          VERSION: ${{ env.version }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          for abi in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            # Read the version from the built file, so a mismatch between the tag and the
            # Gradle property fails here instead of shipping a mislabelled APK.
            apk="V2rayNG/app/build/outputs/apk/playstore/release/NiNG_${VERSION}_${abi}.apk"
            test -f "$apk" || {
              echo "::error::expected $apk for declared version $VERSION"
              ls V2rayNG/app/build/outputs/apk/playstore/release/ || true
              exit 1
            }
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "release-files/${abi}-signature.txt"
            grep -q 'e489aa56f25cee8c062840d7822b0a4e20d31f1b95de147675d1a50e5cac09c6' "release-files/${abi}-signature.txt"
            "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" > "release-files/${abi}-package.txt"
            grep -q "package: name='com.herbertkara.ning'" "release-files/${abi}-package.txt"
            cp "$apk" release-files/
          done
          cd release-files
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NiNG-signed-release
          path: release-files/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-unit-test-reports
          path: |
            V2rayNG/app/build/reports/tests/
            V2rayNG/app/build/test-results/
          if-no-files-found: ignore
      - name: Remove decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/ning-release.p12"
  release:
    # Must wait for sign-and-release, not build: the NiNG-signed-release artifact is only
    # uploaded by the signing job, so depending on build made this job run before it existed.
    needs: sign-and-release
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NiNG-signed-release
          path: release-files
      - name: Create draft prerelease on fork only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          SHA: ${{ github.sha }}
          # The branch the run was dispatched on or called from; --target needs a ref GitHub will
          # create a tag on, and a branch name is one of the two things that works.
          BRANCH: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ning\.[0-9]+$ ]]
          # A manual dispatch leaves this a draft, which is deliberate: someone asked for a build
          # and should look at it before anyone is offered it. The sync passes draft=false, and it
          # has to be able to publish, because a release left as a draft is invisible to the
          # in-app updater -- which is the only reason the sync is watching upstream at all.
          draft_flag="--draft"
          if [ "${{ inputs.draft }}" = "false" ]; then draft_flag=""; fi
          # --prerelease is not a property of a build that is still being tested, it is a label
          # GitHub shows. Every release was created with it, so /releases/latest kept pointing at
          # an older build: a visitor who opened the repository saw .29 while .30 was the one the
          # app could update to. A prerelease also does not notify subscribers.
          #
          # So the flag follows the draft flag, which is the thing that actually means "not ready":
          # a manual dispatch leaves it a draft to look at, the sync passes draft: false and
          # publishes it as the current release.
          # The release page is where someone lands after Play Protect has already worried them,
          # so it repeats the three things that decide whether they install: what this is, why the
          # warning is expected, and how to confirm the file. It is generated here so it cannot
          # fall out of step with the README.
          {
            printf '## Play Protect will warn you. Here is why that is expected.\n\n'
            printf 'This build is signed with a self-signed key, not one issued by Google, which is true of\n'
            printf 'every app installed from outside the Play Store -- including V2RayNG and PattNG.\n\n'
            printf 'If Play Protect blocks the install, the one-time fix is:\n\n'
            printf '**Play Protect -> Settings -> App verification -> Off**\n\n'
            printf 'That setting only affects installs from outside the Play Store.\n\n'
            printf '## Check the download\n\n'
            printf '```\n'
            printf 'sha256sum %s_arm64-v8a.apk\n' "$TAG"
            printf '```\n\n'
            printf 'Compare it with the line for that file in `SHA256SUMS.txt`. If they differ, do not install it.\n\n'
            printf '## What this is\n\n'
            printf 'A fork of [PattNG](https://github.com/patterniha/PattNG), which is itself a fork of\n'
            printf '[V2RayNG](https://github.com/2dust/v2rayNG). Not an official build of either. Farsi UI,\n'
            printf 'a country flag per server, and an in-app updater. Licensed GPL-3.0.\n\n'
            printf 'Per-server flags have two speeds: a fast one from DNS, which can show a CDN or proxy\n'
            printf 'address rather than the origin, and an exact one behind a button on the row that asks\n'
            printf 'the connection itself.\n'
          } > release-notes.md
          # --target takes a ref GitHub is willing to create a tag on, and that means the tip of
          # a branch or the branch name itself -- not an arbitrary commit. Measured on the runner
          # token: a tip SHA and a branch name both work, a commit that is an ancestor but not the
          # tip comes back 403 Resource not accessible by integration, and no --target at all
          # works. So the pin that was here broke exactly when the branch moved while the build
          # was running, which is what happened: the release step was refused while every other
          # step was green, and the message named neither the flag nor the branch.
          #
          # The tag still has to land on the commit whose APK was built, so that is checked
          # instead of assumed. If the branch moved, the release names a version that would point
          # at a different commit than the files beside it, and saying so is more useful than a
          # 403 from an API call.
          tip=$(gh api "repos/herbert-kara/NiNG/branches/$BRANCH" --jq .commit.sha)
          if [ "$tip" != "$SHA" ]; then
            echo "::error::$BRANCH moved to ${tip:0:8} while this build ran, so tag $TAG cannot be placed on the built commit ${SHA:0:8}. Re-run the release."
            exit 1
          fi
          NOTES=$(cat release-notes.md)
          pre_flag="--prerelease"
          if [ "${{ inputs.draft }}" = "false" ]; then pre_flag=""; fi
          latest_flag="--latest"
          if [ "${{ inputs.draft }}" != "false" ]; then latest_flag=""; fi
          gh release create "$TAG" --repo herbert-kara/NiNG --target "$BRANCH" $draft_flag $pre_flag $latest_flag --title "NiNG $TAG" --notes "$NOTES" release-files/*
