name: NiNG signed APK release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag for a draft prerelease (empty uploads artifacts only)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ning-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'herbert-kara/NiNG'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUST_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;29.0.14206865'
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact native cache identity
        id: native
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "hev=$(git rev-parse HEAD:hev-socks5-tunnel)" >> "$GITHUB_OUTPUT"
          echo "aether=$(git rev-parse HEAD:aether)" >> "$GITHUB_OUTPUT"
      - name: Download paired Xray core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
          mkdir -p V2rayNG/app/libs
          gh release download "$tag" --repo patterniha/AndroidLibXrayLite --pattern libv2ray.aar --dir V2rayNG/app/libs
      - name: Compile and unit tests before native build
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest --stacktrace
      - uses: actions/cache@v4
        id: hev-cache
        with:
          path: libs
          key: hev-${{ runner.os }}-ndk29-${{ steps.native.outputs.hev }}-${{ hashFiles('compile-hevtun.sh') }}
      - name: Build pinned hev
        if: steps.hev-cache.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh
      - uses: actions/cache@v4
        id: aether-cache
        with:
          path: libs-aether
          key: aether-${{ runner.os }}-ndk29-${{ env.RUST_TOOLCHAIN }}-${{ steps.native.outputs.aether }}-${{ hashFiles('compile-aether.sh') }}
      - uses: dtolnay/rust-toolchain@master
        if: steps.aether-cache.outputs.cache-hit != 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Build pinned Aether
        if: steps.aether-cache.outputs.cache-hit != 'true'
        run: bash compile-aether.sh
      - name: Stage native libraries
        run: |
          cp -r libs/. V2rayNG/app/libs/
          cp -r libs-aether/. V2rayNG/app/libs/
      - name: Decode stable NiNG release key
        env:
          KEYSTORE: ${{ secrets.NING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ning-release.p12"
      - name: Assemble signed release
        working-directory: V2rayNG
        env:
          STORE_PASSWORD: ${{ secrets.NING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assemblePlaystoreRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/ning-release.p12" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -Pandroid.injected.signing.store.type=PKCS12
      - name: Verify signatures and package contents
        run: |
          set -euo pipefail
          mkdir -p release-files
          for abi in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            apk="V2rayNG/app/build/outputs/apk/playstore/release/NiNG_2.3.8-ning.1_${abi}.apk"
            test -f "$apk"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "release-files/${abi}-signature.txt"
            grep -q 'e489aa56f25cee8c062840d7822b0a4e20d31f1b95de147675d1a50e5cac09c6' "release-files/${abi}-signature.txt"
            "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" > "release-files/${abi}-package.txt"
            grep -q "package: name='com.herbertkara.ning'" "release-files/${abi}-package.txt"
            cp "$apk" release-files/
          done
          cd release-files
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NiNG-signed-release
          path: release-files/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-unit-test-reports
          path: |
            V2rayNG/app/build/reports/tests/
            V2rayNG/app/build/test-results/
          if-no-files-found: ignore
      - name: Remove decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/ning-release.p12"
  release:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NiNG-signed-release
          path: release-files
      - name: Create draft prerelease on fork only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          SHA: ${{ github.sha }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ning\.[0-9]+$ ]]
          gh release create "$TAG" --repo herbert-kara/NiNG --target "$SHA" --draft --prerelease --title "NiNG $TAG" --notes "Signed NiNG APKs. Unit tests passed in CI. Android device runtime testing remains separate." release-files/*
