name: NiNG compile and unit tests
on:
  workflow_dispatch:
  push:
    branches: [my-releases]
permissions:
  contents: read
env:
  # The Go line AndroidLibXrayLite's own workflow builds its AAR with; pinned so the AAR this
  # workflow builds from the submodule is the same one upstream would publish.
  GO_VERSION: "1.26"
concurrency:
  group: ning-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.repository == 'herbert-kara/NiNG'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      # Compiling needs Libv2ray, and the AAR that provides it is a native artifact whose symbols
      # have to match the Kotlin that calls them. Upstream's release tag lags the commit PattNG
      # pins, so tools/fetch-libv2ray.sh takes the release only when the tag is that commit and
      # builds from the submodule otherwise -- which needs Go and the NDK here too.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/cache@v4
        id: libv2ray
        with:
          path: V2rayNG/app/libs/libv2ray.aar
          key: libv2ray-${{ runner.os }}-ndk29-${{ hashFiles('.git/modules/AndroidLibXrayLite/HEAD') }}
      - name: Install the NDK the core builds against
        if: steps.libv2ray.outputs.cache-hit != 'true'
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 \
            --install "ndk;29.0.14206865"
      - name: Fetch or build libv2ray
        if: steps.libv2ray.outputs.cache-hit != 'true'
        run: bash tools/fetch-libv2ray.sh
      - name: Compile and unit test
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            V2rayNG/app/build/reports/tests/
            V2rayNG/app/build/test-results/
          if-no-files-found: ignore
