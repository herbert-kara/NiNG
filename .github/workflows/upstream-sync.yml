name: NiNG rebuild from upstream

# The fork tracks patterniha/PattNG. When that repository pushes, rebuild the signed APKs
# from the merged tree and publish a prerelease, so an installed NiNG updates itself through
# its own in-app updater instead of waiting for a manual dispatch.
on:
  repository_dispatch:
    types: [upstream-update]
  schedule:
    # Off the hour, away from :00, to avoid the scheduled-run congestion on GitHub's side.
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  # The sync merges upstream and pushes the result, so it needs write. With read the merge is
  # computed, the fork features are verified, and then the push is refused with a 403 -- the run
  # reports failure having changed nothing, which is the same as no sync at all.
  contents: write
  actions: read
concurrency:
  group: ning-upstream-rebuild
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'herbert-kara/NiNG'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      commit: ${{ steps.merge.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: my-releases
      - name: Merge upstream without dropping fork features
        id: merge
        env:
          UPSTREAM: https://github.com/patterniha/PattNG.git
        run: |
          set -euo pipefail
          git config user.name 'herbert-kara'
          git config user.email 'herbert-kara@users.noreply.github.com'
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          git fetch upstream --quiet
          base=$(git merge-base HEAD upstream/master || git merge-base HEAD upstream/main)
          # HEAD..upstream/HEAD, not $base..upstream/HEAD. The history has more than one merge base, so
          # the base form reports commits that are already merged: it listed five of them on a run
          # whose own next line said there was nothing to do, which reads as upstream having work
          # that was skipped. This range is what is genuinely unmerged, and it is empty when the
          # fork is current.
          echo "upstream commits not yet merged:"
          git log --oneline HEAD..upstream/HEAD | head -20
          echo "unmerged count: $(git rev-list --count HEAD..upstream/HEAD)"
          if git merge-base --is-ancestor upstream/HEAD HEAD; then
            echo "Already up to date with upstream; nothing to rebuild."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A merge commit, never a rebase or a reset: the fork's own commits (identity, flags,
          # reputation verdict, CI) must survive an upstream merge untouched and stay reviewable.
          if ! git merge --no-edit --no-stat upstream/HEAD; then
            echo "::error::Upstream merge conflicts. Resolve on my-releases and re-run."
            git diff --name-only --diff-filter=U
            exit 1
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"
          # The release job builds from my-releases, so it has to be told the exact commit rather
          # than re-reading a branch that could move between the two jobs.
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff --stat "$base" HEAD | tail -20
      - name: Verify fork features survived the merge
        if: steps.merge.outputs.merged == 'true'
        run: |
          set -euo pipefail
          python3 tools/verify_brand.py
          # Every path the fork owns and upstream does not have. A merge can only delete one of
          # these, so this is the check that matters: the brand guard proves the strings and the
          # colours are right, and this proves the files they live in are still there at all.
          missing=0
          while IFS= read -r f; do
            case "$f" in ''|'#'*) continue;; esac
            if [ ! -e "$f" ]; then
              echo "::error::fork file lost in the upstream merge: $f"
              missing=$((missing + 1))
            fi
          done < tools/fork_manifest.txt
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing file(s) this fork owns are gone after the merge. Upstream renamed or removed them; bring the fork's version across on my-releases before releasing."
            exit 1
          fi
          echo "all $(grep -cv '^#' tools/fork_manifest.txt) fork files survived the merge"
      - name: Push the merge so the branch keeps its history
        if: steps.merge.outputs.merged == 'true'
        env:
          # Pushing the commit that was just built rather than the branch name: if a dispatch and
          # a schedule overlap, the second push would otherwise re-push a stale branch and be
          # rejected, leaving a merge that passed every check unpublished.
          MERGED: ${{ steps.merge.outputs.commit }}
        id: push
        run: git push origin "$MERGED:my-releases"

      - name: Derive the next -ning version from existing tags
        id: version
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Not max over tag strings: that puts v2.3.9-ning.100 before v2.3.9-ning.99, so the
          # first release past .99 would carry a tag the updater has already seen and nobody
          # would be offered the build. Compared as numbers, and jq prints the finished tag so
          # there is nothing to recompute in the shell and no second tool to disagree with it.
          tag=$(gh release list -R herbert-kara/NiNG --limit 100 --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]+[.][0-9]+[.][0-9]+-ning[.][0-9]+$"))] as $t | (if ($t | length) > 0 then ($t | map({v: [split("-ning.")[0] | ltrimstr("v") | scan("[0-9]+") | tonumber], n: (split("-ning.")[1] | tonumber)}) | max_by([.v[0], .v[1], .v[2], .n])) else {v: [0,0,0], n: -1} end) as $m | ("v" + ($m.v | map(tostring) | join(".")) + "-ning." + (($m.n + 1) | tostring))')
          echo "next release: $tag"
          # A tag that already exists means the version step lost a race or read a stale list.
          # Publishing over one replaces an APK that is already installed on someone's phone, so
          # it stops here instead.
          if gh release view "$tag" -R herbert-kara/NiNG >/dev/null 2>&1; then
            echo "::error::$tag already exists. Someone released while this run was merging; re-run."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.sync.outputs.tag }}
      draft: false
    secrets: inherit
    permissions:
      contents: write
      actions: read
